<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="footer" th:fragment="footer">
    <div>
        <strong th:text="${appName}">머니계산기</strong>
        <p>본 사이트의 계산 결과는 참고용이며 법률, 세무, 투자, 노무 자문을 대체하지 않습니다.</p>
    </div>
    <div class="footer-links">
        <a href="/about">사이트 소개</a>
        <a href="/guide">이용안내</a>
        <a href="/privacy-policy">개인정보처리방침</a>
        <a href="/terms">이용약관</a>
        <a href="/disclaimer">면책고지</a>
        <a href="/contact">문의하기</a>
        <a href="/sitemap.xml">사이트맵</a>
    </div>
    <p class="copyright">© <span th:text="${currentYear}">2026</span> <span th:text="${appName}">머니계산기</span>. All rights reserved.</p>
    <script th:if="${adfit.hasRenderablePageSlot()}" th:nonce="${cspNonce}">
        (function () {
            var sdkSrc = 'https://t1.kakaocdn.net/kas/static/ba.min.js';
            var mobileMedia = window.matchMedia('(max-width: 820px)');
            var state = window.MoneytoolsAdFit = window.MoneytoolsAdFit || {};
            state.initializedPlacements = state.initializedPlacements || {};
            state.initializedUnits = state.initializedUnits || {};

            function selectedUnit(slot) {
                var prefix = mobileMedia.matches ? 'mobile' : 'desktop';
                var unit = slot.dataset['adfit' + capitalize(prefix) + 'Unit'];
                var width = slot.dataset['adfit' + capitalize(prefix) + 'Width'];
                var height = slot.dataset['adfit' + capitalize(prefix) + 'Height'];
                if (!unit || !unit.trim() || !width || !height) {
                    return null;
                }
                return { unit: unit.trim(), width: width, height: height };
            }

            function capitalize(value) {
                return value.charAt(0).toUpperCase() + value.slice(1);
            }

            function mountSlot(slot) {
                if (!slot || slot.dataset.adfitMounted === 'true') {
                    return false;
                }
                var placement = slot.dataset.adfitPlacement || '';
                var unit = selectedUnit(slot);
                if (!unit) {
                    slot.remove();
                    return false;
                }
                var placementKey = window.location.pathname + '::placement::' + placement;
                var unitKey = window.location.pathname + '::unit::' + unit.unit;
                if (state.initializedPlacements[placementKey] || state.initializedUnits[unitKey]) {
                    slot.remove();
                    return false;
                }

                var frame = slot.querySelector('.adfit-slot-frame');
                if (!frame) {
                    slot.remove();
                    return false;
                }
                frame.style.width = unit.width + 'px';
                frame.style.height = unit.height + 'px';

                var adArea = document.createElement('ins');
                adArea.className = 'kakao_ad_area';
                adArea.style.display = 'none';
                adArea.style.width = '100%';
                adArea.setAttribute('data-ad-unit', unit.unit);
                adArea.setAttribute('data-ad-width', unit.width);
                adArea.setAttribute('data-ad-height', unit.height);
                frame.appendChild(adArea);

                state.initializedPlacements[placementKey] = true;
                state.initializedUnits[unitKey] = true;
                slot.dataset.adfitMounted = 'true';
                return true;
            }

            function loadSdkOnce() {
                if (document.querySelector('script[src="' + sdkSrc + '"]')) {
                    return;
                }
                var script = document.createElement('script');
                script.type = 'text/javascript';
                script.charset = 'utf-8';
                script.src = sdkSrc;
                script.async = true;
                document.body.appendChild(script);
            }

            function initAdFitSlots() {
                var mounted = false;
                document.querySelectorAll('.adfit-slot[data-adfit-placement]').forEach(function (slot) {
                    mounted = mountSlot(slot) || mounted;
                });
                if (mounted) {
                    loadSdkOnce();
                }
            }

            window.requestAnimationFrame(initAdFitSlots);
        })();
    </script>
    <script th:src="@{/js/calculator.js(v=${staticAssetVersion})}" defer></script>
</footer>
</body>
</html>
