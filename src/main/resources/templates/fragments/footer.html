<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="footer" th:fragment="footer">
    <div class="kakao-mobile-ad-banner"
         th:if="${adsAllowedOnPage}"
         data-ad-unit="DAN-xCcp5jWABTT3AHyB"
         data-ad-width="320"
         data-ad-height="50"
         style="width:100%;min-width:320px;min-height:50px;text-align:center;"></div>
    <div>
        <strong th:text="${appName}">머니계산기</strong>
        <p>본 사이트의 계산 결과는 참고용이며 법률, 세무, 투자, 노무 자문을 대체하지 않습니다.</p>
    </div>
    <div class="footer-links">
        <a href="/about">사이트 소개</a>
        <a href="/guide">이용안내</a>
        <a href="/privacy-policy">개인정보처리방침</a>
        <a href="/terms">이용약관</a>
        <a href="/disclaimer">면책고지</a>
        <a href="/contact">문의하기</a>
        <a href="/sitemap.xml">사이트맵</a>
    </div>
    <p class="copyright">© <span th:text="${currentYear}">2026</span> <span th:text="${appName}">머니계산기</span>. All rights reserved.</p>
    <script th:if="${adsAllowedOnPage}" th:nonce="${cspNonce}">
        (function () {
            var sdkSrc = '//t1.kakaocdn.net/kas/static/ba.min.js';
            var mobileMedia = window.matchMedia('(max-width: 820px)');
            var desktopMedia = window.matchMedia('(min-width: 821px)');
            var maxAttempts = 20;
            var attempt = 0;

            function appendAdArea(adWrapper) {
                if (!adWrapper || adWrapper.querySelector('.kakao_ad_area')) {
                    return;
                }

                var adArea = document.createElement('ins');
                adArea.className = 'kakao_ad_area';
                adArea.style.display = 'none';
                adArea.setAttribute('data-ad-unit', adWrapper.dataset.adUnit);
                adArea.setAttribute('data-ad-width', adWrapper.dataset.adWidth);
                adArea.setAttribute('data-ad-height', adWrapper.dataset.adHeight);
                adWrapper.appendChild(adArea);
            }

            function isVisibleAdWrapper(adWrapper) {
                return adWrapper && adWrapper.getBoundingClientRect().width > 0;
            }

            function mountDesktopBannerAds() {
                if (!desktopMedia.matches) {
                    return;
                }

                document.querySelectorAll('.kakao-desktop-ad-banner[data-ad-unit]').forEach(function (adWrapper) {
                    if (isVisibleAdWrapper(adWrapper)) {
                        appendAdArea(adWrapper);
                    }
                });
            }

            function mountMobileRectangleAds() {
                if (!mobileMedia.matches) {
                    return;
                }

                document.querySelectorAll('.kakao-mobile-rectangle-ad[data-ad-unit]').forEach(function (adWrapper) {
                    if (isVisibleAdWrapper(adWrapper)) {
                        appendAdArea(adWrapper);
                    }
                });
            }

            function mountMobileFooterAd() {
                var footerAd = document.querySelector('.kakao-mobile-ad-banner[data-ad-unit]');
                if (!footerAd) {
                    return;
                }
                if (!mobileMedia.matches) {
                    return;
                }

                appendAdArea(footerAd);
            }

            function mountRightRailAd() {
                var railAd = document.querySelector('.kakao-right-rail-ad[data-ad-unit]');
                if (!railAd) {
                    return;
                }
                if (!desktopMedia.matches) {
                    return;
                }

                appendAdArea(railAd);
            }

            function loadAdFitWhenReady() {
                mountDesktopBannerAds();
                mountMobileRectangleAds();
                mountMobileFooterAd();
                mountRightRailAd();
                var adAreas = document.querySelectorAll('.kakao_ad_area');
                var isReady = Array.prototype.some.call(adAreas, function (adArea) {
                    var adWrapper = adArea.closest('.kakao-adfit-card, .kakao-mobile-ad-banner, .kakao-right-rail-ad');
                    return isVisibleAdWrapper(adWrapper);
                });

                if (isReady) {
                    if (document.querySelector('script[src="' + sdkSrc + '"], script[src="https://t1.kakaocdn.net/kas/static/ba.min.js"]')) {
                        return;
                    }
                    var script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.src = sdkSrc;
                    script.async = true;
                    document.body.appendChild(script);
                    return;
                }

                attempt += 1;
                if (attempt < maxAttempts) {
                    window.requestAnimationFrame(loadAdFitWhenReady);
                }
            }

            window.requestAnimationFrame(loadAdFitWhenReady);
        })();
    </script>
    <script th:src="@{/js/calculator.js(v=${staticAssetVersion})}" defer></script>
</footer>
</body>
</html>
