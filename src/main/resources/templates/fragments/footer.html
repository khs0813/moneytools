<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="footer" th:fragment="footer">
    <div>
        <strong th:text="${appName}">머니계산기</strong>
        <p>본 사이트의 계산 결과는 참고용이며 법률, 세무, 투자, 노무 자문을 대체하지 않습니다.</p>
    </div>
    <div class="footer-links">
        <a href="/about">사이트 소개</a>
        <a href="/guide">이용안내</a>
        <a href="/privacy-policy">개인정보처리방침</a>
        <a href="/terms">이용약관</a>
        <a href="/disclaimer">면책고지</a>
        <a href="/contact">문의하기</a>
        <a href="/sitemap.xml">사이트맵</a>
    </div>
    <p class="copyright">© <span th:text="${currentYear}">2026</span> <span th:text="${appName}">머니계산기</span>. All rights reserved.</p>
    <script th:if="${adfit.hasRenderablePageSlot()}" th:nonce="${cspNonce}">
        (function () {
            var sdkSrc = 'https://t1.kakaocdn.net/kas/static/ba.min.js';
            var mobileMedia = window.matchMedia('(max-width: 820px)');
            var state = window.MoneytoolsAdFit = window.MoneytoolsAdFit || {};
            state.initializedPlacements = state.initializedPlacements || readSessionMap('moneytools:adfit:placements');
            state.initializedUnits = state.initializedUnits || {};
            state.sdkRequested = state.sdkRequested || false;

            function readSessionMap(key) {
                try {
                    return JSON.parse(window.sessionStorage.getItem(key) || '{}') || {};
                } catch (error) {
                    return {};
                }
            }

            function writeSessionMap(key, value) {
                try {
                    window.sessionStorage.setItem(key, JSON.stringify(value));
                } catch (error) {
                    // Session storage can be unavailable in private or restricted browsing modes.
                }
            }

            function selectedUnit(slot) {
                var prefix = mobileMedia.matches ? 'mobile' : 'desktop';
                var unit = slot.dataset['adfit' + capitalize(prefix) + 'Unit'];
                var width = slot.dataset['adfit' + capitalize(prefix) + 'Width'];
                var height = slot.dataset['adfit' + capitalize(prefix) + 'Height'];
                if (!unit || !unit.trim() || !width || !height) {
                    return null;
                }
                return { unit: unit.trim(), width: width, height: height };
            }

            function capitalize(value) {
                return value.charAt(0).toUpperCase() + value.slice(1);
            }

            function visibleResultCard() {
                var results = document.querySelectorAll('[data-result-card]');
                for (var i = 0; i < results.length; i += 1) {
                    if (!results[i].hidden && results[i].offsetParent !== null) {
                        return results[i];
                    }
                }
                return null;
            }

            function slotCanRequest(slot) {
                if (slot.dataset.adfitRequiresResult !== 'true') {
                    return true;
                }
                if (visibleResultCard()) {
                    slot.hidden = false;
                    return true;
                }
                slot.hidden = true;
                return false;
            }

            function trackAdEvent(eventName, slot, unit) {
                var details = {
                    placement: slot.dataset.adfitPlacement || '',
                    device: mobileMedia.matches ? 'mobile' : 'desktop',
                    ad_size: unit ? unit.width + 'x' + unit.height : '',
                    experiment_id: slot.dataset.adfitExperimentId || 'control'
                };
                if (window.MoneytoolsAnalytics && typeof window.MoneytoolsAnalytics.trackEvent === 'function') {
                    window.MoneytoolsAnalytics.trackEvent(eventName, details);
                    return;
                }
                window.MoneytoolsAnalyticsQueue = window.MoneytoolsAnalyticsQueue || [];
                window.MoneytoolsAnalyticsQueue.push({ eventName: eventName, details: details });
            }

            function hasRenderedCreative(frame) {
                return !!frame.querySelector('iframe, img, a, object, embed')
                        || Array.prototype.some.call(frame.querySelectorAll('ins.kakao_ad_area'), function (element) {
                            return element.children.length > 0;
                        });
            }

            function observeRender(slot, unit, frame) {
                var rendered = false;
                var observer = null;
                var failTimer = null;
                var markRendered = function () {
                    if (rendered) {
                        return;
                    }
                    rendered = true;
                    if (observer) {
                        observer.disconnect();
                    }
                    if (failTimer) {
                        window.clearTimeout(failTimer);
                    }
                    trackAdEvent('ad_slot_rendered', slot, unit);
                };

                if ('MutationObserver' in window) {
                    observer = new MutationObserver(function () {
                        if (hasRenderedCreative(frame)) {
                            markRendered();
                        }
                    });
                    observer.observe(frame, { childList: true, subtree: true });
                }

                window.requestAnimationFrame(function () {
                    if (hasRenderedCreative(frame)) {
                        markRendered();
                    }
                });

                failTimer = window.setTimeout(function () {
                    if (rendered) {
                        return;
                    }
                    if (hasRenderedCreative(frame)) {
                        markRendered();
                        return;
                    }
                    if (observer) {
                        observer.disconnect();
                    }
                    trackAdEvent('ad_slot_failed', slot, unit);
                    slot.remove();
                }, 8000);
            }

            function observeViewability(slot, unit) {
                if (!('IntersectionObserver' in window)) {
                    return;
                }
                var viewTimer = null;
                var tracked = false;
                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (tracked) {
                            return;
                        }
                        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                            if (viewTimer) {
                                return;
                            }
                            viewTimer = window.setTimeout(function () {
                                tracked = true;
                                observer.unobserve(slot);
                                trackAdEvent('ad_slot_viewable', slot, unit);
                            }, 1000);
                            return;
                        }
                        if (viewTimer) {
                            window.clearTimeout(viewTimer);
                            viewTimer = null;
                        }
                    });
                }, { threshold: [0, 0.5, 1] });
                observer.observe(slot);
            }

            function mountSlot(slot) {
                if (!slot || slot.dataset.adfitMounted === 'true') {
                    return false;
                }
                if (!slotCanRequest(slot)) {
                    return false;
                }
                var placement = slot.dataset.adfitPlacement || '';
                var unit = selectedUnit(slot);
                if (!unit) {
                    slot.remove();
                    return false;
                }
                var placementKey = window.location.pathname + '::placement::' + placement;
                var unitKey = window.location.pathname + '::unit::' + unit.unit;
                if (state.initializedPlacements[placementKey] || state.initializedUnits[unitKey]) {
                    slot.remove();
                    return false;
                }

                var frame = slot.querySelector('.adfit-slot-frame');
                if (!frame) {
                    slot.remove();
                    return false;
                }
                frame.style.width = unit.width + 'px';
                frame.style.height = unit.height + 'px';

                var adArea = document.createElement('ins');
                adArea.className = 'kakao_ad_area';
                adArea.style.display = 'block';
                adArea.style.width = unit.width + 'px';
                adArea.style.height = unit.height + 'px';
                adArea.setAttribute('data-ad-unit', unit.unit);
                adArea.setAttribute('data-ad-width', unit.width);
                adArea.setAttribute('data-ad-height', unit.height);
                frame.appendChild(adArea);

                state.initializedPlacements[placementKey] = true;
                state.initializedUnits[unitKey] = true;
                writeSessionMap('moneytools:adfit:placements', state.initializedPlacements);
                slot.dataset.adfitMounted = 'true';
                trackAdEvent('ad_slot_requested', slot, unit);
                observeRender(slot, unit, frame);
                observeViewability(slot, unit);
                return true;
            }

            function loadSdkOnce() {
                if (state.sdkRequested || document.querySelector('script[src="' + sdkSrc + '"]')) {
                    return;
                }
                state.sdkRequested = true;
                var script = document.createElement('script');
                script.type = 'text/javascript';
                script.charset = 'utf-8';
                script.src = sdkSrc;
                script.async = true;
                document.body.appendChild(script);
            }

            function initAdFitSlots() {
                var mounted = false;
                document.querySelectorAll('.adfit-slot[data-adfit-placement]').forEach(function (slot) {
                    mounted = mountSlot(slot) || mounted;
                });
                if (mounted) {
                    loadSdkOnce();
                }
            }

            state.initAdFitSlots = initAdFitSlots;
            window.requestAnimationFrame(initAdFitSlots);
        })();
    </script>
    <script th:src="@{/js/calculator.js(v=${staticAssetVersion})}" defer></script>
</footer>
</body>
</html>
