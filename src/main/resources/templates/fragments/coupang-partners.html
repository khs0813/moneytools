<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="kakao-adfit-top-slot"
     th:fragment="dynamicBanner">
</div>
<div class="kakao-adfit-result-slot"
     th:fragment="resultAd"
     th:if="${adsAllowedOnPage and adfit.v2Enabled() and (adfit.hasResultMobileUnit() or adfit.hasResultPcUnit())}">
    <section class="kakao-adfit-card kakao-result-pc-ad"
             th:if="${adfit.hasResultPcUnit()}"
             th:attr="data-ad-unit=${adfit.resultPcUnit()}"
             data-ad-width="728"
             data-ad-height="90"></section>
    <section class="kakao-adfit-card kakao-result-mobile-ad"
             th:if="${adfit.hasResultMobileUnit()}"
             th:attr="data-ad-unit=${adfit.resultMobileUnit()}"
             data-ad-width="300"
             data-ad-height="250"></section>
</div>
<div class="kakao-adfit-result-slot"
     th:fragment="clientResultAd"
     th:if="${adsAllowedOnPage and adfit.v2Enabled() and (adfit.hasResultMobileUnit() or adfit.hasResultPcUnit())}"
     data-result-ad-slot
     hidden>
    <section class="kakao-adfit-card kakao-result-pc-ad"
             th:if="${adfit.hasResultPcUnit()}"
             th:attr="data-ad-unit=${adfit.resultPcUnit()}"
             data-ad-width="728"
             data-ad-height="90"></section>
    <section class="kakao-adfit-card kakao-result-mobile-ad"
             th:if="${adfit.hasResultMobileUnit()}"
             th:attr="data-ad-unit=${adfit.resultMobileUnit()}"
             data-ad-width="300"
             data-ad-height="250"></section>
</div>
</body>
</html>
