<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle}, ${pageDescription}, ${canonicalUrl})}"></head>
<body>
<button class="mobile-menu-button" type="button" data-menu-toggle aria-label="메뉴 열기">☰</button>
<div class="app-shell">
    <aside th:replace="~{fragments/nav :: sidebar(${activeMenu})}"></aside>
    <main class="main-content">
        <div th:replace="~{fragments/components :: breadcrumbs(${page})}"></div>
        <div th:replace="~{fragments/components :: pageHero('연차수당 계산기', ${pageDescription})}"></div>
        <div th:replace="~{fragments/components :: calculationBasis(${activeMenu})}"></div>

        <section class="calculator-layout" th:classappend="${result != null} ? ' has-result' : ''">
            <form class="calculator-form" th:action="@{/annual-leave-pay-calculator}" th:object="${form}" method="post">
                <h2>입력값</h2>
                <label>수당 대상 미사용 연차일수
                    <input type="text" inputmode="decimal" autocomplete="off" data-number-input="decimal" data-min="0" data-max="36500" data-decimals="2" min="0" max="36500" step="0.01" id="unusedLeaveDays" name="unusedLeaveDays" th:value="${@inputFieldValueFormatter.formatDecimal(form, 'unusedLeaveDays')}">
                    <small class="field-help">회사 휴가대장이나 정산 안내에서 확인한, 실제 수당 지급 대상 일수를 입력합니다.</small>
                    <span class="field-error" th:if="${#fields.hasErrors('unusedLeaveDays')}" th:errors="*{unusedLeaveDays}"></span>
                </label>
                <label>1일 통상임금
                    <input type="text" inputmode="numeric" autocomplete="off" data-money-input data-number-input="integer" id="dailyOrdinaryWage" name="dailyOrdinaryWage" th:value="${@inputFieldValueFormatter.formatInteger(form, 'dailyOrdinaryWage')}">
                    <span class="field-error" th:if="${#fields.hasErrors('dailyOrdinaryWage')}" th:errors="*{dailyOrdinaryWage}"></span>
                </label>
                <button class="primary-button" type="submit">계산하기</button>
            </form>
            <section class="result-panel" aria-live="polite" th:if="${result != null}" data-result-card>
                <h2>계산 결과</h2>
                <div class="result-grid">
                    <div><span>수당 대상 미사용 연차</span><strong th:text="${#numbers.formatDecimal(result.unusedLeaveDays, 0, 'COMMA', 2, 'POINT')} + '일'">0일</strong></div>
                    <div><span>1일 통상임금</span><strong th:text="${#numbers.formatDecimal(result.dailyOrdinaryWage, 0, 'COMMA', 0, 'POINT')} + '원'">0원</strong></div>
                    <div><span>예상 연차수당</span><strong th:text="${#numbers.formatDecimal(result.estimatedAllowance, 0, 'COMMA', 0, 'POINT')} + '원'">0원</strong></div>
                </div>
                <button class="ghost-button" type="button" data-copy-result>결과 복사</button>
            </section>
            <div th:replace="~{fragments/components :: calculatorSideNote}"></div>
            <div th:replace="~{fragments/adfit :: slot('calculator_post_tool')}"></div>
        </section>

        <div th:replace="~{fragments/components :: disclaimer('연차수당은 회사에서 확인한 수당 대상 미사용 연차일수와 1일 통상임금을 곱해 산정하는 단순 참고값입니다. 연차 발생일, 소멸일, 출근율, 사용촉진 여부에 따라 실제 지급 대상 일수는 달라질 수 있습니다.')}" ></div>
        <section class="content-card">
            <h2>입력값과 결과 해석</h2>
            <p>이 페이지는 자동 발생 연차를 확정하지 않습니다. 회사에서 확인한 수당 대상 미사용 연차일수를 입력하고, 미사용 연차수당 = 수당 대상 미사용 연차일수 × 1일 통상임금으로 계산합니다.</p>
        </section>
        <div th:replace="~{fragments/longform :: calculatorContent(${activeMenu})}"></div>
        <div th:replace="~{fragments/components :: officialSources(${activeMenu})}"></div>
        <div th:replace="~{fragments/components :: faqList(${faqs})}"></div>
        <div th:replace="~{fragments/components :: relatedLinks(${activeMenu})}"></div>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
</body>
</html>
