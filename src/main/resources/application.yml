server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml,image/png

spring:
  application:
    name: moneytools
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  web:
    resources:
      cache:
        period: 365d

app:
  name: ${APP_NAME:머니계산기}
  # 운영 도메인을 설정하면 canonical, sitemap, OG URL이 고정됩니다.
  # 비워두면 요청 호스트를 기준으로 절대 URL을 생성합니다.
  base-url: ${APP_BASE_URL:https://www.moneycalculator.co.kr}
  description: ${APP_DESCRIPTION:대출이자, 실수령액, 퇴직금, 해외주식 세금, 배당 등 자주 찾는 금융 계산기 모음}
  contact-email: ${APP_CONTACT_EMAIL:moneyfinancecalculator@gmail.com}
  google-site-verification: ${GOOGLE_SITE_VERIFICATION:}
  naver-site-verification: ${NAVER_SITE_VERIFICATION:}
  home:
    featured-cluster: ${HOME_FEATURED_CLUSTER:electricity}
    active-from: ${HOME_FEATURED_ACTIVE_FROM:2026-06-01}
    active-until: ${HOME_FEATURED_ACTIVE_UNTIL:2026-09-30}
  adfit:
    enabled: ${PUBLIC_ADFIT_ENABLED:false}
    allowed-hosts: ${PUBLIC_ADFIT_ALLOWED_HOSTS:www.moneycalculator.co.kr}
    experiment: ${PUBLIC_ADFIT_EXPERIMENT:off}
    calc-pre-faq-routes: ${PUBLIC_ADFIT_CALC_PRE_FAQ_ROUTES:}
    units:
      calc-post-tool-desktop: ${PUBLIC_ADFIT_CALC_POST_TOOL_DESKTOP:}
      calc-post-tool-mobile: ${PUBLIC_ADFIT_CALC_POST_TOOL_MOBILE:}
      calc-article-desktop: ${PUBLIC_ADFIT_CALC_ARTICLE_DESKTOP:}
      calc-article-mobile: ${PUBLIC_ADFIT_CALC_ARTICLE_MOBILE:}
      guide-desktop: ${PUBLIC_ADFIT_GUIDE_DESKTOP:}
      guide-mobile: ${PUBLIC_ADFIT_GUIDE_MOBILE:}
      home-desktop: ${PUBLIC_ADFIT_HOME_DESKTOP:}
      home-mobile: ${PUBLIC_ADFIT_HOME_MOBILE:}
      calc-post-tool-mobile-alt: ${PUBLIC_ADFIT_CALC_POST_TOOL_MOBILE_ALT:}
      calc-pre-faq-desktop: ${PUBLIC_ADFIT_CALC_PRE_FAQ_DESKTOP:}
      calc-pre-faq-mobile: ${PUBLIC_ADFIT_CALC_PRE_FAQ_MOBILE:}
